<!doctype html><html lang="es"><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prueba de galería</title><link rel="stylesheet" href="/styles.css?v=reservas-20261107"></head><body><main class="admin-app" style="padding:25px"><h1>Prueba de galería</h1><p>Ejemplo simulado; no envía ni modifica datos.</p><form id="productForm"><input name="id" value="ejemplo" hidden><input name="name" value="Plato"><input name="price" value="5"><input name="meal" value="Almuerzo"><textarea name="ingredients">Harina</textarea><textarea name="description"></textarea><fieldset><legend>Fotos del plato</legend><label>Foto portada <input name="photo" type="file" accept="image/jpeg,image/png,image/webp"></label><label>Fotos adicionales <input name="gallery" type="file" multiple accept="image/jpeg,image/png,image/webp"></label><div id="photoPreview" class="photo-preview" hidden></div></fieldset><div id="photoStatus"></div><button type="submit" id="publishButton">Probar guardado</button><button type="button" id="cancelEdit">Cancelar</button><p id="adminFeedback"></p></form><div id="testResults"></div></main><script>const currentUser={uid:'test'},ADMIN_UID='test',feedback=document.querySelector('#adminFeedback'),productForm=document.querySelector('#productForm');let stagedImages=[],coverId='',products={},selectedMeal='Desayuno';const MAX_FILE=5*1024*1024,MAX_TOTAL=20*1024*1024,MAX_IMAGES=6;function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function say(n,t,e=false){n.textContent=t}function icons(){}function resetForm(){document.querySelector('#testResults').textContent='Guardado simulado: fotos '+stagedImages.length;stagedImages=[];coverId='';updatePreview()}function ref(db,s){return s}const db=null;async function update(path,payload){document.querySelector('#testResults').textContent=JSON.stringify(payload);await new Promise(r=>setTimeout(r,700))}function fakeUploadPhoto(file,cb){return new Promise(resolve=>{let p=0;const timer=setInterval(()=>{p=Math.min(100,p+10);cb(p);if(p===100){clearInterval(timer);resolve('https://example.org/'+encodeURIComponent(file.name))}},300)})}const photoInput=productForm.elements.photo,galleryInput=productForm.elements.gallery;function makeId(){return 'img-'+Math.random().toString(36).slice(2)}
function updatePreview(){const box=document.querySelector('#photoPreview');if(!stagedImages.length){box.innerHTML='';box.hidden=true;return}box.hidden=false;box.innerHTML=stagedImages.map((im,i)=>`<article class="image-preview-item ${im.id===coverId?'is-cover':''}"><img src="${esc(im.preview||im.url)}" alt="Vista previa ${im.id===coverId?'de portada':'adicional'}"><div class="image-preview-info"><b>${im.id===coverId?'Portada':'Foto adicional'}${im.pending?' · pendiente de subir':''}</b>${im.uploadState?`<div class="image-upload-progress" data-progress-id="${esc(im.id)}"><div class="image-upload-label"><span>${im.uploadState==='uploaded'?'Subida, pendiente de guardar':im.uploadState==='error'?'No se pudo subir':im.uploadState==='uploading'?'Subiendo':'En espera'}</span><b>${im.progress||0}%</b></div><progress max="100" value="${im.progress||0}" aria-label="Progreso de la imagen ${i+1}"></progress></div>`:''}<div class="image-preview-actions">${im.id!==coverId?`<button type="button" data-cover="${esc(im.id)}">Usar como portada</button>`:''}<button type="button" data-remove-image="${esc(im.id)}" aria-label="Quitar imagen ${i+1}">Quitar</button></div></div></article>`).join('');box.querySelectorAll('[data-cover]').forEach(b=>b.onclick=()=>{coverId=b.dataset.cover;updatePreview()});box.querySelectorAll('[data-remove-image]').forEach(b=>b.onclick=()=>{const im=stagedImages.find(x=>x.id===b.dataset.removeImage);if(im?.preview&&im.pending)URL.revokeObjectURL(im.preview);const wasCover=coverId===b.dataset.removeImage;stagedImages=stagedImages.filter(x=>x.id!==b.dataset.removeImage);if(wasCover){coverId=stagedImages[0]?.id||'';photoInput.value='';photoInput.required=!coverId}updatePreview();say(document.querySelector('#photoStatus'),coverId?'Imagen actualizada.':'Selecciona una foto de portada.')})}
function filesToStage(files,asCover=false){const prior=asCover?stagedImages.find(x=>x.id===coverId):null;const currentBytes=stagedImages.reduce((s,x)=>s+(x.file?.size||0),0)-(prior?.file?.size||0);if(stagedImages.length-(prior?1:0)+files.length>MAX_IMAGES)throw Error(`Puedes gestionar hasta ${MAX_IMAGES} imágenes por plato. Quita fotos antes de añadir más.`);if(currentBytes+files.reduce((s,f)=>s+f.size,0)>MAX_TOTAL)throw Error('El total de imágenes nuevas no puede superar 20 MB.');for(const file of files){if(!['image/jpeg','image/png','image/webp'].includes(file.type))throw Error('Solo se aceptan imágenes JPG, PNG o WebP.');if(file.size<=0||file.size>MAX_FILE)throw Error('Cada imagen debe pesar hasta 5 MB.');if(asCover&&coverId){const prior=stagedImages.find(x=>x.id===coverId);if(prior?.preview&&prior.pending)URL.revokeObjectURL(prior.preview);stagedImages=stagedImages.filter(x=>x.id!==coverId);coverId=''}const item={id:makeId(),file,preview:URL.createObjectURL(file),pending:true};stagedImages.push(item);if(asCover||!coverId)coverId=item.id;asCover=false}}
photoInput.addEventListener('change',()=>{try{const file=photoInput.files[0];if(!file)return;const prior=stagedImages.find(x=>x.id===coverId);if(prior?.pending&&prior.file===file)return;filesToStage([file],true);photoInput.required=false;updatePreview();say(document.querySelector('#photoStatus'),'Portada seleccionada. Revísala abajo; se subirá al guardar el plato.')}catch(err){photoInput.value='';say(document.querySelector('#photoStatus'),err.message,true)}});
galleryInput.addEventListener('change',()=>{try{filesToStage([...galleryInput.files]);updatePreview();say(document.querySelector('#photoStatus'),'Fotos adicionales seleccionadas. Se subirán al guardar.')}catch(err){say(document.querySelector('#photoStatus'),err.message,true)}finally{galleryInput.value=''}});
function uploadPhoto(file,onProgress){return new Promise((resolve,reject)=>{const fd=new FormData();fd.append('file',file);fd.append('upload_preset',cloudinaryConfig.uploadPreset);fd.append('folder','noglimar/menu');const xhr=new XMLHttpRequest();xhr.open('POST',cloudinaryConfig.uploadEndpoint);xhr.upload.onprogress=e=>{if(e.lengthComputable)onProgress(Math.round(e.loaded/e.total*100))};xhr.onload=()=>{let data={};try{data=JSON.parse(xhr.responseText)}catch{}if(xhr.status>=200&&xhr.status<300&&data.secure_url)resolve(data.secure_url);else reject(Error(data.error?.message||'No se pudo subir una imagen. No se guardaron los cambios del plato.'))};xhr.onerror=()=>reject(Error('Falló la conexión durante la carga. Los datos guardados del plato no se cambiaron.'));xhr.onabort=()=>reject(Error('Carga cancelada. Los datos guardados del plato no se cambiaron.'));xhr.send(fd)})}
productForm.addEventListener('submit',async e=>{e.preventDefault();if(!currentUser||currentUser.uid!==ADMIN_UID){say(feedback,'Sesión sin permisos de administración.',true);return}const f=productForm,b=document.querySelector('#publishButton'),editId=f.elements.id.value.trim();b.disabled=true;document.querySelector('#cancelEdit').disabled=true;say(feedback,'');try{const ingredients=f.elements.ingredients.value.split('\n').map(x=>x.trim()).filter(Boolean);if(!ingredients.length)throw Error('Escribe al menos un ingrediente.');if(ingredients.length>30)throw Error('Se permiten hasta 30 ingredientes.');const name=f.elements.name.value.trim(),price=Number(f.elements.price.value);if(!name||name.length>90||!Number.isFinite(price)||price<=0||price>10000000)throw Error('Revisa el nombre y el precio.');if(stagedImages.length>MAX_IMAGES)throw Error(`Puedes añadir hasta ${MAX_IMAGES} fotos nuevas.`);if(!coverId||!stagedImages.some(x=>x.id===coverId))throw Error('Selecciona la portada del plato.');let done=0;const pending=stagedImages.filter(x=>x.pending);pending.forEach(im=>{im.progress=0;im.uploadState='waiting'});const photosFieldset=photoInput.closest('fieldset');photosFieldset.disabled=true;updatePreview();try{for(const im of pending){im.uploadState='uploading';updatePreview();say(document.querySelector('#photoStatus'),`Subiendo imagen ${++done} de ${pending.length}…`);try{im.url=await fakeUploadPhoto(im.file,pct=>{im.progress=pct;const node=document.querySelector(`[data-progress-id="${im.id}"]`);if(node){node.querySelector('progress').value=pct;node.querySelector('.image-upload-label b').textContent=`${pct}%`}say(document.querySelector('#photoStatus'),`Subiendo imagen ${done} de ${pending.length} · ${pct}%`)});im.progress=100;im.uploadState='uploaded';im.pending=false;URL.revokeObjectURL(im.preview);im.preview='';updatePreview()}catch(err){im.uploadState='error';updatePreview();throw err}}say(document.querySelector('#photoStatus'),pending.length?'Imágenes cargadas. Guardando el plato…':'Guardando el plato…')}finally{}const cover=stagedImages.find(x=>x.id===coverId);const galleryUrls=stagedImages.filter(x=>x.id!==coverId).map(x=>x.url);if(!cover?.url)throw Error('La portada no quedó cargada. Los datos del menú siguen intactos.');const old=editId?products[editId]:null;const payload={name,meal:f.elements.meal.value,price,ingredients,description:f.elements.description.value.trim(),imageUrl:cover.url,updatedAt:Date.now(),updatedBy:currentUser.uid};if(editId)payload.galleryUrls=galleryUrls.length?galleryUrls:null;else if(galleryUrls.length)payload.galleryUrls=galleryUrls;if(editId)await update(ref(db,`menus/${editId}`),payload);else{const newRef=push(menuRef);await set(newRef,{...payload,createdAt:Date.now(),createdBy:currentUser.uid})}resetForm();say(feedback,editId?'Se actualizó el plato y sus fotos.':'El plato se publicó en el catálogo.')}catch(err){say(feedback,err.message||'No se pudo guardar el plato.',true)}finally{photoInput.closest('fieldset').disabled=false;b.disabled=false;document.querySelector('#cancelEdit').disabled=false;icons()}});
</script></body></html>
