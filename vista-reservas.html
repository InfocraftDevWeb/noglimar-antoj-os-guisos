<!doctype html><html lang="es"><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vista previa de reservas</title><link rel="stylesheet" href="/styles.css?v=reservas-20261107"></head><body><main class="admin-app"><div class="admin-hero"><span class="admin-kicker">VISTA PREVIA CON DATOS DE EJEMPLO</span><h1>Reservas</h1><p>Diseño de prueba. No modifica pedidos reales.</p></div><section class="admin-list-section"><div id="ordersFilters" class="orders-filters"></div><div id="adminOrders"></div></section></main><script>function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function adminDialog(){return Promise.resolve(false)}function api(){throw Error('Solo vista previa')}const currentUser=null;let orderRows=[{id:'ejemplo-001',createdAt:Date.now(),orderStatus:'received',customer:{name:'Cliente de ejemplo',phone:'0412 0000000'},lines:[{name:'Plato de ejemplo',quantity:2}],totalCents:1300,fulfillment:{mode:'delivery',address:'Dirección de ejemplo'},payment:{method:'mobile',status:'pending_review',payerBank:'Banco de ejemplo',payerPhone:'04120000000',referenceLast4:'1234',receiptId:'demo',quoted:{vesCents:500000,rateValue:1000,rateDate:'2026-11-07'}}},{id:'ejemplo-002',createdAt:Date.now(),orderStatus:'accepted',customer:{name:'Otra persona',phone:'04120000000'},lines:[{name:'Plato',quantity:1}],totalCents:650,fulfillment:{mode:'pickup'},payment:{method:'cash',status:'verified'}},{id:'ejemplo-003',orderStatus:'cancelled',customer:{name:'Ejemplo'},lines:[],fulfillment:{mode:'pickup'},payment:{method:'cash',status:'pending'}}],orderFilter='all';
const orderStatusLabels={received:'Por confirmar',accepted:'Confirmada',preparing:'En preparación',ready:'Lista para entregar',fulfilled:'Completada',cancelled:'Rechazada / cancelada'};
const paymentStatusLabels={pending_review:'Por revisar',pending:'Pendiente',verified:'Confirmado',rejected:'Rechazado'};
const orderFilters=[['all','Todas'],['received','Por confirmar'],['accepted','Confirmadas'],['preparing','En preparación'],['ready','Listas'],['fulfilled','Completadas'],['cancelled','Rechazadas']];
function orderDate(v){if(!v)return '';const d=new Date(v);return Number.isNaN(d.getTime())?'':new Intl.DateTimeFormat('es-VE',{dateStyle:'medium',timeStyle:'short',timeZone:'America/Caracas'}).format(d)}
function renderOrders(){const target=document.querySelector('#adminOrders'),toolbar=document.querySelector('#ordersFilters');if(!target||!toolbar)return;toolbar.innerHTML=orderFilters.map(([value,label])=>`<button type="button" class="order-filter ${orderFilter===value?'is-selected':''}" data-order-filter="${value}" aria-pressed="${orderFilter===value}">${label}<span>${value==='all'?orderRows.length:orderRows.filter(o=>o.orderStatus===value).length}</span></button>`).join('');toolbar.querySelectorAll('[data-order-filter]').forEach(b=>b.onclick=()=>{orderFilter=b.dataset.orderFilter;renderOrders()});const rows=orderRows.filter(o=>orderFilter==='all'||o.orderStatus===orderFilter);if(!rows.length){target.innerHTML='<p class="orders-empty">No hay reservas en esta sección.</p>';return}const next={received:['accepted','Aceptar reserva'],accepted:['preparing','Iniciar preparación'],preparing:['ready','Marcar como lista'],ready:['fulfilled','Marcar como entregada']};target.innerHTML=rows.map(o=>{const p=o.payment||{},ful=o.fulfillment||{},step=next[o.orderStatus],canCancel=['received','accepted','preparing','ready'].includes(o.orderStatus),mobile=p.method==='mobile';let payActions='';if(o.orderStatus!=='cancelled'&&mobile&&p.status==='pending_review')payActions='<button type="button" class="order-btn order-btn-primary" data-pay="verified">Confirmar pago</button><button type="button" class="order-btn order-btn-danger" data-pay="rejected">Rechazar pago</button>';if(o.orderStatus!=='cancelled'&&!mobile&&p.method==='cash'&&p.status==='pending')payActions='<button type="button" class="order-btn order-btn-primary" data-pay="verified">Confirmar efectivo recibido</button>';return `<article class="order-card"><div class="order-card-head"><div><span class="order-eyebrow">RESERVA</span><h3>#${esc(o.id)}</h3>${orderDate(o.createdAt)?`<time>${esc(orderDate(o.createdAt))}</time>`:''}</div><span class="order-badge order-${esc(o.orderStatus)}">${esc(orderStatusLabels[o.orderStatus]||o.orderStatus)}</span></div><div class="order-customer"><strong>${esc(o.customer?.name||'Cliente')}</strong><span>${esc(o.customer?.phone||'')}</span></div><div class="order-lines">${(o.lines||[]).map(x=>`<div><span>${esc(x.name)}</span><b>× ${esc(x.quantity)}</b></div>`).join('')}</div><div class="order-total"><span>Total</span><b>$${(Number(o.totalCents||0)/100).toFixed(2)}</b></div><p class="order-fulfillment"><b>${ful.mode==='delivery'?'Entrega a domicilio':ful.mode==='pickup'?'Retiro':esc(ful.mode||'Entrega')}</b>${ful.address?' · '+esc(ful.address):''}${ful.notes?'<br>Indicaciones: '+esc(ful.notes):''}</p><section class="order-payment"><div class="order-section-title"><b>${mobile?'Pago Móvil':'Pago en efectivo'}</b><span class="pay-badge pay-${esc(p.status||'pending')}">${esc(paymentStatusLabels[p.status]||p.status||'Pendiente')}</span></div>${mobile?`<p>${esc(p.payerBank||'')} · ${esc(p.payerPhone||'')} · ref. ****${esc(p.referenceLast4||'')}</p>${p.quoted?`<p>Monto mostrado: Bs ${(Number(p.quoted.vesCents||0)/100).toFixed(2)} · tasa ${esc(p.quoted.rateValue||'')} (${esc(p.quoted.rateDate||'')})</p>`:''}${p.amountChanged?'<p class="order-warning">Importante: cambió el monto o la tasa; revisa el pago.</p>':''}${p.rejectionReason?`<p>Motivo: ${esc(p.rejectionReason)}</p>`:''}`:'<p>Confirma el efectivo solo cuando lo hayas recibido.</p>'}<div class="order-buttons">${mobile&&p.receiptId?'<button type="button" class="order-btn order-btn-outline" data-receipt>Ver comprobante</button>':''}${payActions}</div></section><section class="order-next"><b>Gestión de la reserva</b><div class="order-buttons">${step?`<button type="button" class="order-btn order-btn-primary" data-order="${step[0]}">${step[1]}</button>`:''}${canCancel?`<button type="button" class="order-btn order-btn-danger" data-order="cancelled">${o.orderStatus==='received'?'Rechazar reserva':'Cancelar reserva'}</button>`:''}${!step&&!canCancel?'<span class="order-final">No hay acciones pendientes.</span>':''}</div></section></article>`}).join('');target.querySelectorAll('.order-card').forEach((el,i)=>{const o=rows[i];el.querySelectorAll('[data-order]').forEach(b=>b.onclick=async()=>{if(b.dataset.order==='cancelled'&&!await adminDialog('¿Quieres rechazar o cancelar esta reserva? Esta acción no se puede deshacer desde el panel.',{confirm:true}))return;b.disabled=true;try{await api(`/api/admin/orders/${encodeURIComponent(o.id)}`,{method:'PATCH',body:JSON.stringify({orderStatus:b.dataset.order})});await loadOrders()}catch(e){await adminDialog(e.message);b.disabled=false}});el.querySelector('[data-receipt]')?.addEventListener('click',async()=>{try{const token=await currentUser.getIdToken(),r=await fetch(`/api/admin/receipts/${encodeURIComponent(o.payment.receiptId)}`,{headers:{Authorization:`Bearer ${token}`},cache:'no-store'});if(!r.ok)throw Error('No se pudo abrir el comprobante.');const blob=await r.blob(),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='comprobante-pago.jpg';a.click();setTimeout(()=>URL.revokeObjectURL(url),60000)}catch(e){await adminDialog(e.message)}});el.querySelectorAll('[data-pay]').forEach(b=>b.onclick=async()=>{let reason='';if(b.dataset.pay==='rejected'){reason=await adminDialog('Motivo del rechazo:',{input:true})||'';if(!reason)return}if(b.dataset.pay==='verified'&&!await adminDialog('¿Confirmas que verificaste y recibiste este pago?',{confirm:true}))return;b.disabled=true;try{await api(`/api/admin/orders/${encodeURIComponent(o.id)}`,{method:'PATCH',body:JSON.stringify({paymentStatus:b.dataset.pay,...(reason?{rejectionReason:reason}:{})})});await loadOrders()}catch(e){await adminDialog(e.message);b.disabled=false}})})}
async function loadOrders(){const target=document.querySelector('#adminOrders'),statusNode=document.querySelector('#ordersStatus');if(!target)return;try{orderRows=await api('/api/admin/orders');statusNode.textContent=`${orderRows.length} reservas`;renderOrders()}catch(e){statusNode.textContent=e.message;target.innerHTML='<p>No fue posible cargar reservas.</p>'}}
;renderOrders();</script></body></html>
